<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>装备提升清单</title>
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("mabinogi-equipment-upgrade-planner-theme");
        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020304;
      --surface: #090c0f;
      --surface-soft: #10151a;
      --surface-raised: #141a20;
      --ink: #f2f5f7;
      --muted: #929da7;
      --line: #222a31;
      --line-strong: #35404a;
      --primary: #9be7ff;
      --primary-hover: #c9f3ff;
      --primary-contrast: #061014;
      --primary-soft: rgba(88, 198, 231, .14);
      --amber: #ffd36a;
      --amber-soft: rgba(255, 189, 61, .13);
      --blue: #99d9ff;
      --blue-soft: rgba(95, 181, 255, .14);
      --danger: #ff928a;
      --danger-soft: rgba(255, 101, 90, .12);
      --header-bg: #000;
      --header-ink: #f7f9fb;
      --header-muted: #a6b0b9;
      --header-input: #0b0f12;
      --row-priority: rgba(110, 217, 255, .055);
      --row-complete: rgba(255, 255, 255, .015);
      --focus: rgba(129, 219, 255, .34);
      --backdrop: rgba(0, 0, 0, .78);
      --page-glow: radial-gradient(circle at 86% -12%, rgba(77, 194, 255, .09), transparent 28%), radial-gradient(circle at 12% 4%, rgba(169, 102, 255, .045), transparent 22%);
      --spectrum: linear-gradient(90deg, #ff3b30 0 13%, #ff9f0a 13% 27%, #ffd60a 27% 41%, #7ee02a 41% 55%, #25d9e9 55% 70%, #4f7cff 70% 84%, #b76ce2 84% 100%);
      --shadow: 0 22px 70px rgba(0, 0, 0, .52);
      --radius: 10px;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f3f6f4;
      --surface: #ffffff;
      --surface-soft: #f7f9f8;
      --surface-raised: #ffffff;
      --ink: #1d2927;
      --muted: #687570;
      --line: #d8dfdc;
      --line-strong: #bdc8c4;
      --primary: #176b5b;
      --primary-hover: #115547;
      --primary-contrast: #ffffff;
      --primary-soft: #e8f3ef;
      --amber: #a96d13;
      --amber-soft: #fff5df;
      --blue: #386b9b;
      --blue-soft: #ebf3fa;
      --danger: #b64d3f;
      --danger-soft: #fff0ed;
      --header-bg: #173c35;
      --header-ink: #f7fbf9;
      --header-muted: #d6e3df;
      --header-input: #ffffff;
      --row-priority: #f4faf7;
      --row-complete: #fafbfa;
      --focus: rgba(23, 107, 91, .25);
      --backdrop: rgba(19, 32, 29, .48);
      --page-glow: none;
      --shadow: 0 12px 32px rgba(27, 47, 42, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background-color: var(--bg);
      background-image: var(--page-glow);
      background-attachment: fixed;
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }
    button { letter-spacing: 0; }

    .app-header {
      position: relative;
      color: var(--header-ink);
      background: var(--header-bg);
      border-bottom: 1px solid var(--line);
    }

    .app-header::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: var(--spectrum);
      opacity: .84;
    }

    .header-inner,
    main {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .header-inner {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 0;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }

    .tools-home-link {
      color: var(--header-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-decoration: none;
    }

    .tools-home-link:hover { color: var(--header-ink); }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0;
    }

    .header-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
    }

    .rate-setting {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rate-heading {
      color: var(--header-ink);
      font-size: 12px;
      font-weight: 700;
    }

    .rate-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--header-muted);
      white-space: nowrap;
    }

    .rate-control input {
      width: 84px;
      height: 34px;
      padding: 0 9px;
      color: var(--ink);
      background: var(--header-input);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .theme-toggle {
      min-height: 36px;
      display: inline-grid;
      grid-template-columns: auto 28px auto;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      color: var(--header-muted);
      background: rgba(255, 255, 255, .045);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      cursor: pointer;
    }

    .theme-toggle:hover { color: var(--header-ink); border-color: var(--primary); }

    .theme-toggle-track {
      width: 28px;
      height: 16px;
      position: relative;
      background: #1c252c;
      border: 1px solid #4b5861;
      border-radius: 999px;
    }

    .theme-toggle-track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(183, 231, 255, .75);
      transform: translateX(12px);
      transition: transform .18s ease;
    }

    :root[data-theme="light"] .theme-toggle-track::after { transform: translateX(0); }
    .theme-toggle .theme-light,
    :root[data-theme="light"] .theme-toggle .theme-dark { opacity: .55; }
    .theme-toggle .theme-dark,
    :root[data-theme="light"] .theme-toggle .theme-light { color: var(--header-ink); opacity: 1; font-weight: 700; }

    main { padding: 22px 0 40px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .stat::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139, 224, 255, .72), transparent);
      opacity: .58;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }

    .stat-value {
      margin-top: 3px;
      overflow-wrap: anywhere;
      font-size: 21px;
      line-height: 1.25;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-detail {
      min-height: 18px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line-strong);
    }

    .toolbar-spacer { flex: 1 1 auto; }

    .mobile-sort {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .mobile-sort select {
      min-height: 36px;
      max-width: 180px;
      padding: 0 30px 0 10px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
    }

    .notice {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      cursor: pointer;
    }

    .button:hover { background: var(--surface-soft); }

    .button-primary {
      color: var(--primary-contrast);
      background: var(--primary);
      border-color: var(--primary);
    }

    .button-primary:hover { background: var(--primary-hover); }

    .button-ghost {
      min-height: 30px;
      padding: 0 8px;
      background: transparent;
      border-color: transparent;
    }

    .button-ghost:hover {
      background: var(--surface-soft);
      border-color: var(--line);
    }

    .button-danger { color: var(--danger); }

    .button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 1px;
    }

    .table-shell {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.reorder { width: 78px; }
    col.plan { width: 46px; }
    col.gear { width: 16%; }
    col.affix { width: 23%; }
    col.uplift { width: 16%; }
    col.price { width: 13%; }
    col.value { width: 12%; }
    col.status { width: 88px; }
    col.actions { width: 116px; }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      text-align: left;
      overflow-wrap: anywhere;
    }

    th {
      height: 44px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 600;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.is-pending { background: var(--row-priority); }
    tbody tr.is-pending .gear-name { color: var(--ink); font-weight: 750; }
    tbody tr.is-pending:hover { background: var(--primary-soft); }
    tbody tr.is-inactive { background: var(--row-complete); opacity: .52; }
    tbody tr.is-completed .gear-name { text-decoration: line-through; text-decoration-thickness: 1px; }
    tbody tr.is-dragging { opacity: .35; }
    tbody tr.is-drag-over { box-shadow: inset 0 2px 0 var(--primary); }

    .group-header-row td {
      padding: 9px 12px;
      color: var(--muted);
      background: var(--surface-soft);
      border-bottom: 1px solid var(--line-strong);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .group-header-row.is-priority td {
      color: var(--ink);
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .group-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .group-heading-detail { color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; }

    .center { text-align: center; }
    .numeric { text-align: right; font-variant-numeric: tabular-nums; }

    .sort-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      padding: 0;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
      text-align: right;
    }

    .sort-button:hover { color: var(--primary); }
    .sort-indicator { width: 12px; color: var(--primary); }

    .plan-check {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .plan-check:disabled { cursor: not-allowed; }

    .reorder-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
    }

    .reorder-button {
      width: 24px;
      height: 28px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1;
    }

    .reorder-button:hover { color: var(--primary); background: var(--surface-soft); border-color: var(--line); }
    .reorder-button:disabled { opacity: .25; cursor: not-allowed; background: transparent; border-color: transparent; }
    .drag-handle { cursor: grab; font-size: 16px; }
    .drag-handle:active { cursor: grabbing; }

    .gear-part {
      color: var(--muted);
      font-size: 12px;
    }

    .gear-name {
      margin-top: 2px;
      font-weight: 650;
    }

    .row-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      white-space: pre-wrap;
    }

    .affix-current,
    .affix-target {
      white-space: pre-wrap;
    }

    .affix-current { color: var(--muted); }
    .affix-arrow { margin: 3px 0; color: var(--primary); font-size: 12px; }

    .main-number {
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .uplift-list {
      display: grid;
      gap: 5px;
    }

    .uplift-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: baseline;
    }

    .uplift-name {
      color: var(--muted);
      font-size: 12px;
      text-align: left;
    }

    .uplift-value { white-space: nowrap; }

    .uplift-line.is-primary .uplift-name {
      color: var(--ink);
      font-weight: 650;
    }

    .primary-mark {
      display: inline-block;
      margin-right: 4px;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
    }

    .kind-mark {
      display: inline-block;
      margin-right: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .sub-number {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .status-watch { color: var(--amber); background: var(--amber-soft); }
    .status-ready { color: var(--blue); background: var(--blue-soft); }
    .status-done { color: var(--primary); background: var(--primary-soft); }
    .status-drop { color: var(--danger); background: var(--danger-soft); }

    .actions-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
    }

    .empty-state {
      padding: 54px 20px 62px;
      text-align: center;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .empty-state strong { display: block; margin-bottom: 14px; font-size: 16px; }
    .hidden { display: none !important; }

    dialog {
      width: min(680px, calc(100% - 28px));
      max-height: calc(100vh - 32px);
      padding: 0;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    dialog::backdrop { background: var(--backdrop); }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-header h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .dialog-close {
      width: 34px;
      height: 34px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .dialog-close:hover { background: var(--surface-soft); border-color: var(--line); }

    .form-body {
      max-height: calc(100vh - 150px);
      overflow-y: auto;
      padding: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .field { min-width: 0; }
    .field-wide { grid-column: 1 / -1; }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      min-height: 39px;
      padding: 8px 10px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    .inline-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      gap: 8px;
    }

    .field-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .field-heading {
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    .field-heading > div { min-width: 0; }
    .field-heading .button { flex: 0 0 auto; white-space: nowrap; }
    .field-heading .field-hint { margin-top: 1px; }

    .uplift-editor {
      display: grid;
      gap: 8px;
    }

    .uplift-row {
      display: grid;
      grid-template-columns: 42px 104px minmax(110px, 1.35fr) minmax(78px, .62fr) minmax(72px, .56fr) 36px;
      gap: 7px;
      align-items: center;
    }

    .primary-choice {
      min-height: 39px;
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .primary-choice input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--primary);
    }

    .remove-uplift {
      width: 36px;
      min-height: 36px;
      padding: 0;
      color: var(--danger);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 19px;
    }

    .remove-uplift:hover { background: var(--danger-soft); border-color: var(--line); }
    .remove-uplift:disabled { opacity: .3; cursor: not-allowed; background: transparent; border-color: transparent; }

    .currency-input {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: stretch;
    }

    .currency-input span {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: var(--surface-soft);
      border: 1px solid var(--line-strong);
      border-right: 0;
      border-radius: 6px 0 0 6px;
    }

    .currency-input input { border-radius: 0 6px 6px 0; }

    .dialog-rate {
      min-height: 39px;
      display: grid;
      grid-template-columns: auto minmax(70px, 1fr);
      gap: 7px;
      align-items: center;
      color: var(--muted);
      white-space: nowrap;
    }

    .field-hint {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .form-error {
      min-height: 20px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 12px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    #importFile { display: none; }

    @media (max-width: 820px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .stat:first-child { grid-column: 1 / -1; }
      .mobile-sort { display: inline-flex; }
      .table-shell { background: transparent; }
      table, tbody { display: block; }
      thead, colgroup { display: none; }

      tbody tr {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 18px;
        padding: 10px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--line-strong);
      }

      tbody tr.is-pending { background: var(--row-priority); }
      .group-header-row { display: block; padding: 0; }
      .group-header-row td { display: block; padding: 10px 12px; border-bottom: 0; }

      td {
        min-width: 0;
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 12px;
      }

      td[data-col="plan"],
      td[data-col="reorder"],
      td[data-col="gear"],
      td[data-col="affix"],
      td[data-col="actions"] { grid-column: 1 / -1; }

      td[data-col="plan"] {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      td[data-col="plan"]::after { content: "标记完成"; color: var(--muted); font-size: 12px; }
      tr.is-completed td[data-col="plan"]::after { content: "已完成（取消可恢复）"; }
      td[data-col="plan"]::before { display: none; }
      td[data-col="reorder"] { display: flex; justify-content: flex-end; align-items: center; }
      td[data-col="reorder"]::before { margin-right: auto; }
      td[data-col="actions"] { display: flex; justify-content: flex-end; border-bottom: 0; }
      td[data-col="actions"]::before { display: none; }
      .numeric { text-align: left; }
      .actions-wrap { justify-content: flex-end; }
    }

    @media (max-width: 600px) {
      .header-inner, main { width: min(100% - 24px, 1180px); }
      .header-inner { align-items: flex-start; flex-direction: column; gap: 12px; }
      .header-tools { width: 100%; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .rate-setting { align-items: flex-start; flex-direction: column; gap: 4px; }
      h1 { font-size: 21px; }
      .stats { grid-template-columns: 1fr; }
      .stat:first-child { grid-column: auto; }
      .toolbar-spacer { display: none; }
      .toolbar .button { flex: 1 1 auto; }
      .mobile-sort { flex: 1 1 100%; }
      .mobile-sort select { flex: 1 1 auto; max-width: none; }
      .notice { width: 100%; order: 10; }
      tbody tr { grid-template-columns: 1fr; }
      td[data-col] { grid-column: 1; }
      td[data-col="plan"], td[data-col="reorder"], td[data-col="gear"], td[data-col="affix"], td[data-col="actions"] { grid-column: 1; }
      .form-grid { grid-template-columns: 1fr; }
      .field-wide { grid-column: 1; }
      .form-body { padding: 15px; }
      .uplift-row {
        grid-template-columns: 34px 92px minmax(0, 1fr) 34px;
      }
      .uplift-row [data-uplift-field="kind"] { grid-column: 2; grid-row: 1; }
      .uplift-row [data-uplift-field="label"] { grid-column: 3; grid-row: 1; }
      .uplift-row [data-uplift-field="value"] { grid-column: 2; grid-row: 2; }
      .uplift-row [data-uplift-field="unit"] { grid-column: 3; grid-row: 2; }
      .uplift-row .remove-uplift { grid-column: 4; grid-row: 1; }
    }

    @media (max-width: 430px) {
      .header-tools { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .theme-toggle-track::after { transition: none; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="title-block">
        <a class="tools-home-link" href="../tools/">← 工具列表</a>
        <h1>装备提升清单</h1>
      </div>
      <div class="header-tools">
        <div class="rate-setting">
          <span class="rate-heading">游戏币换算</span>
          <label class="rate-control" for="exchangeRate">
            <span>1亿游戏币 = ¥</span>
            <input id="exchangeRate" type="number" min="0.01" step="0.01" value="114.94" inputmode="decimal" aria-label="1亿游戏币兑换人民币">
          </label>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换为浅色模式">
          <span class="theme-light">Light</span>
          <span class="theme-toggle-track" aria-hidden="true"></span>
          <span class="theme-dark">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="stats" aria-label="计划概览">
      <div class="stat">
        <div class="stat-label">未完成方案</div>
        <div class="stat-value" id="candidateCount">0</div>
        <div class="stat-detail" id="candidateDetail">优先显示在清单上方</div>
      </div>
      <div class="stat">
        <div class="stat-label">待投入预算</div>
        <div class="stat-value" id="selectedBudget">¥0</div>
        <div class="stat-detail" id="selectedGold">0万游戏币</div>
      </div>
      <div class="stat">
        <div class="stat-label">待完成提升</div>
        <div class="stat-value" id="selectedUplift">0</div>
        <div class="stat-detail" id="selectedCount">0个方案等待处理</div>
      </div>
    </section>

    <div class="toolbar" aria-label="清单操作">
      <button class="button button-primary" id="addButton" type="button"><span aria-hidden="true">＋</span>添加方案</button>
      <label class="mobile-sort">排序
        <select id="mobileSort" aria-label="方案排序">
          <option value="manual:asc">手动顺序</option>
          <option value="">最近编辑</option>
          <option value="uplift:desc">提升：高到低</option>
          <option value="uplift:asc">提升：低到高</option>
          <option value="price:asc">价格：低到高</option>
          <option value="price:desc">价格：高到低</option>
          <option value="value:asc">参考单价：低到高</option>
          <option value="value:desc">参考单价：高到低</option>
        </select>
      </label>
      <span class="toolbar-spacer"></span>
      <span class="notice" id="notice" role="status" aria-live="polite"></span>
      <button class="button" id="importButton" type="button">导入</button>
      <button class="button" id="exportButton" type="button">导出</button>
      <button class="button button-danger" id="clearButton" type="button">清空</button>
      <input id="importFile" type="file" accept="application/json,.json">
    </div>

    <section class="table-shell" id="tableShell" aria-label="装备提升方案">
      <table>
        <colgroup>
          <col class="reorder"><col class="plan"><col class="gear"><col class="affix"><col class="uplift">
          <col class="price"><col class="value"><col class="status"><col class="actions">
        </colgroup>
        <thead>
          <tr>
            <th class="center">顺序</th>
            <th class="center">完成</th>
            <th>装备</th>
            <th>属性变化</th>
            <th class="numeric"><button class="sort-button" type="button" data-sort="uplift">提升<span class="sort-indicator" aria-hidden="true"></span></button></th>
            <th class="numeric"><button class="sort-button" type="button" data-sort="price">价格<span class="sort-indicator" aria-hidden="true"></span></button></th>
            <th class="numeric"><button class="sort-button" type="button" data-sort="value">参考单价<span class="sort-indicator" aria-hidden="true"></span></button></th>
            <th>状态</th>
            <th class="numeric">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <section class="empty-state" id="emptyState">
      <strong>还没有升级方案</strong>
      <button class="button button-primary" id="emptyAddButton" type="button"><span aria-hidden="true">＋</span>添加第一项</button>
    </section>
  </main>

  <dialog id="editorDialog" aria-labelledby="dialogTitle">
    <div class="dialog-header">
      <h2 id="dialogTitle">添加升级方案</h2>
      <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭">×</button>
    </div>
    <form id="editorForm" class="form-body" method="dialog" novalidate>
      <input id="itemId" type="hidden">
      <div class="form-grid">
        <div class="field">
          <label for="partInput">部位</label>
          <input id="partInput" type="text" maxlength="40" placeholder="例如：头部" required>
        </div>
        <div class="field">
          <label for="nameInput">装备名称</label>
          <input id="nameInput" type="text" maxlength="80" placeholder="例如：炼金术师帽子" required>
        </div>
        <div class="field field-wide">
          <label for="currentAttributeInput">当前属性</label>
          <textarea id="currentAttributeInput" maxlength="500" placeholder="例如：水炮伤害 18\n炼金术施展速度 15" required></textarea>
        </div>
        <div class="field field-wide">
          <label for="targetAttributeInput">目标属性</label>
          <textarea id="targetAttributeInput" maxlength="500" placeholder="例如：水炮伤害 20\n炼金术施展速度 20" required></textarea>
        </div>
        <div class="field field-wide">
          <div class="field-heading">
            <div>
              <div class="field-label">提升项目</div>
              <div class="field-hint">区分最终%、公式值和普通数值；主指标用于参考单价</div>
            </div>
            <button class="button" id="addUpliftButton" type="button" aria-label="添加提升项目"><span aria-hidden="true">＋</span>添加</button>
          </div>
          <div class="uplift-editor" id="upliftRows"></div>
          <datalist id="upliftUnits">
            <option value="%"><option value="点"><option value="秒"><option value="等级"><option value="距离"><option value="档"><option value="项">
          </datalist>
        </div>
        <div class="field">
          <label for="priceInput">价格（人民币）</label>
          <div class="currency-input">
            <span aria-hidden="true">¥</span>
            <input id="priceInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例如：1724" required>
          </div>
          <div class="field-hint" id="pricePreview">约 0万游戏币</div>
        </div>
        <div class="field">
          <label for="dialogExchangeRate">游戏币换算</label>
          <div class="dialog-rate">
            <span>1亿游戏币 = ¥</span>
            <input id="dialogExchangeRate" type="number" min="0.01" step="0.01" value="114.94" inputmode="decimal">
          </div>
          <div class="field-hint">与页面顶部换算入口同步</div>
        </div>
        <div class="field">
          <label for="statusInput">状态</label>
          <select id="statusInput">
            <option value="watch">观察中</option>
            <option value="ready">准备购买</option>
            <option value="done">已完成</option>
            <option value="drop">已放弃</option>
          </select>
        </div>
        <div class="field">
          <label for="noteInput">备注</label>
          <input id="noteInput" type="text" maxlength="160" placeholder="可不填">
        </div>
        <div class="field field-wide">
          <div class="form-error" id="formError" role="alert"></div>
        </div>
      </div>
      <div class="dialog-actions">
        <button class="button" id="cancelButton" type="button">取消</button>
        <button class="button button-primary" type="submit">保存方案</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "mabinogi-equipment-upgrade-planner-v1";
      const THEME_STORAGE_KEY = "mabinogi-equipment-upgrade-planner-theme";
      const DEFAULT_CNY_PER_YI = 114.94;
      const STATUS = {
        watch: { label: "观察中", className: "status-watch" },
        ready: { label: "准备购买", className: "status-ready" },
        done: { label: "已完成", className: "status-done" },
        drop: { label: "已放弃", className: "status-drop" }
      };
      const UPLIFT_KINDS = {
        final: { label: "最终%", shortLabel: "最终" },
        formula: { label: "公式值", shortLabel: "公式" },
        stat: { label: "普通数值", shortLabel: "数值" }
      };

      const elements = {
        themeToggle: document.getElementById("themeToggle"),
        exchangeRate: document.getElementById("exchangeRate"),
        candidateCount: document.getElementById("candidateCount"),
        candidateDetail: document.getElementById("candidateDetail"),
        selectedBudget: document.getElementById("selectedBudget"),
        selectedGold: document.getElementById("selectedGold"),
        selectedUplift: document.getElementById("selectedUplift"),
        selectedCount: document.getElementById("selectedCount"),
        tableShell: document.getElementById("tableShell"),
        tableBody: document.getElementById("tableBody"),
        emptyState: document.getElementById("emptyState"),
        addButton: document.getElementById("addButton"),
        emptyAddButton: document.getElementById("emptyAddButton"),
        importButton: document.getElementById("importButton"),
        exportButton: document.getElementById("exportButton"),
        clearButton: document.getElementById("clearButton"),
        importFile: document.getElementById("importFile"),
        mobileSort: document.getElementById("mobileSort"),
        notice: document.getElementById("notice"),
        dialog: document.getElementById("editorDialog"),
        dialogTitle: document.getElementById("dialogTitle"),
        dialogClose: document.getElementById("dialogClose"),
        form: document.getElementById("editorForm"),
        itemId: document.getElementById("itemId"),
        part: document.getElementById("partInput"),
        name: document.getElementById("nameInput"),
        currentAttribute: document.getElementById("currentAttributeInput"),
        targetAttribute: document.getElementById("targetAttributeInput"),
        upliftRows: document.getElementById("upliftRows"),
        addUpliftButton: document.getElementById("addUpliftButton"),
        price: document.getElementById("priceInput"),
        pricePreview: document.getElementById("pricePreview"),
        dialogRate: document.getElementById("dialogExchangeRate"),
        status: document.getElementById("statusInput"),
        note: document.getElementById("noteInput"),
        formError: document.getElementById("formError"),
        cancelButton: document.getElementById("cancelButton")
      };

      let state = loadState();
      let sortState = { key: "manual", direction: "asc" };
      let noticeTimer = null;
      let draggedItemId = null;

      function newId() {
        return globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function asFiniteNumber(value, fallback = 0) {
        const number = Number(value);
        return Number.isFinite(number) ? number : fallback;
      }

      function readCnyPerYi(raw, fallback = DEFAULT_CNY_PER_YI) {
        const direct = asFiniteNumber(raw?.cnyPerYi, 0);
        if (direct > 0) return direct;
        const legacyWanPerCny = asFiniteNumber(raw?.rate, 0);
        if (legacyWanPerCny > 0) return Math.round((10000 / legacyWanPerCny) * 100) / 100;
        return fallback;
      }

      function sanitizeUplift(raw) {
        if (!raw || typeof raw !== "object") return null;
        const label = String(raw.label || "").trim().slice(0, 40);
        const value = Number(raw.value);
        const unit = String(raw.unit || "").trim().slice(0, 12);
        const kind = UPLIFT_KINDS[raw.kind] ? raw.kind : "stat";
        if (!label || !Number.isFinite(value) || value === 0) return null;
        return {
          id: String(raw.id || newId()),
          label,
          value,
          unit: kind === "final" ? "%" : unit,
          kind,
          primary: Boolean(raw.primary)
        };
      }

      function sanitizeItem(raw, cnyPerYi = DEFAULT_CNY_PER_YI, fallbackOrder = 0) {
        if (!raw || typeof raw !== "object") return null;
        const part = String(raw.part || "").trim();
        const name = String(raw.name || "").trim();
        const currentAttribute = String(raw.currentAttribute ?? raw.currentAffix ?? "").trim();
        const targetAttribute = String(raw.targetAttribute ?? raw.targetAffix ?? "").trim();
        const rawUplifts = Array.isArray(raw.uplifts) && raw.uplifts.length
          ? raw.uplifts
          : [{ label: raw.upliftLabel || "综合提升", value: raw.uplift, unit: raw.unit || "%", primary: true }];
        const uplifts = rawUplifts.map(sanitizeUplift).filter(Boolean);
        const primaryIndex = uplifts.findIndex(uplift => uplift.primary);
        uplifts.forEach((uplift, index) => { uplift.primary = index === (primaryIndex >= 0 ? primaryIndex : 0); });
        const priceCny = raw.priceCny !== undefined
          ? Math.max(0, asFiniteNumber(raw.priceCny))
          : Math.max(0, asFiniteNumber(raw.priceWan)) / 10000 * Math.max(0.01, cnyPerYi);
        const status = STATUS[raw.status] ? raw.status : "watch";
        const previousStatus = raw.previousStatus === "ready" || raw.previousStatus === "watch"
          ? raw.previousStatus
          : (status === "ready" || status === "watch" ? status : "watch");
        if (!part || !name || !currentAttribute || !targetAttribute || uplifts.length === 0) return null;
        return {
          id: String(raw.id || newId()),
          part,
          name,
          currentAttribute,
          targetAttribute,
          uplifts,
          priceCny,
          order: asFiniteNumber(raw.order, fallbackOrder),
          status,
          previousStatus,
          note: String(raw.note || "").trim().slice(0, 160),
          createdAt: asFiniteNumber(raw.createdAt, Date.now()),
          updatedAt: asFiniteNumber(raw.updatedAt, Date.now())
        };
      }

      function loadState() {
        const fallback = { version: 5, cnyPerYi: DEFAULT_CNY_PER_YI, items: [] };
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          const cnyPerYi = readCnyPerYi(parsed);
          const items = Array.isArray(parsed.items) ? parsed.items.map((item, index) => sanitizeItem(item, cnyPerYi, index)).filter(Boolean) : [];
          return {
            version: 5,
            cnyPerYi,
            items
          };
        } catch (error) {
          return fallback;
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          showNotice("浏览器未能保存数据，请先导出备份。", true);
        }
      }

      function applyTheme(theme, persist = true) {
        const nextTheme = theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        elements.themeToggle.setAttribute("aria-pressed", nextTheme === "dark" ? "true" : "false");
        elements.themeToggle.setAttribute("aria-label", nextTheme === "dark" ? "切换为浅色模式" : "切换为深色模式");
        elements.themeToggle.title = nextTheme === "dark" ? "当前：Dark" : "当前：Light";
        if (!persist) return;
        try {
          localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
        } catch (error) {
          showNotice("浏览器未能记住主题设置。", true);
        }
      }

      function toggleTheme() {
        applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
      }

      function showNotice(message, isError = false) {
        window.clearTimeout(noticeTimer);
        elements.notice.textContent = message;
        elements.notice.style.color = isError ? "var(--danger)" : "var(--muted)";
        noticeTimer = window.setTimeout(() => {
          elements.notice.textContent = "";
        }, 3200);
      }

      function formatNumber(value, maximumFractionDigits = 2) {
        return new Intl.NumberFormat("zh-CN", { maximumFractionDigits }).format(value);
      }

      function formatCny(value) {
        return `¥${formatNumber(value, 2)}`;
      }

      function formatGoldWan(value) {
        if (value >= 10000) return `${formatNumber(value / 10000, 2)}亿`;
        return `${formatNumber(value, 2)}万`;
      }

      function cnyFor(item) {
        return item.priceCny;
      }

      function goldWanFor(item) {
        return item.priceCny / state.cnyPerYi * 10000;
      }

      function primaryUpliftFor(item) {
        return item.uplifts.find(uplift => uplift.primary) || item.uplifts[0];
      }

      function valueFor(item) {
        const primary = primaryUpliftFor(item);
        return primary && primary.value !== 0 ? cnyFor(item) / Math.abs(primary.value) : Number.POSITIVE_INFINITY;
      }

      function formatSignedNumber(value) {
        const formatted = formatNumber(Math.abs(value));
        return `${value > 0 ? "+" : "−"}${formatted}`;
      }

      function textElement(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = text;
        return node;
      }

      function makeCell(label, column) {
        const cell = document.createElement("td");
        cell.dataset.label = label;
        cell.dataset.col = column;
        return cell;
      }

      function isPending(item) {
        return item.status === "watch" || item.status === "ready";
      }

      function completionRank(item) {
        return isPending(item) ? 0 : 1;
      }

      function sortedItems() {
        const items = [...state.items];
        const multiplier = sortState.direction === "asc" ? 1 : -1;
        return items.sort((a, b) => {
          const rankDifference = completionRank(a) - completionRank(b);
          if (rankDifference !== 0) return rankDifference;
          if (!sortState.key) return b.updatedAt - a.updatedAt;
          let left;
          let right;
          if (sortState.key === "manual") {
            left = a.order;
            right = b.order;
          } else if (sortState.key === "uplift") {
            left = Math.abs(primaryUpliftFor(a)?.value || 0);
            right = Math.abs(primaryUpliftFor(b)?.value || 0);
          } else if (sortState.key === "price") {
            left = cnyFor(a);
            right = cnyFor(b);
          } else {
            left = valueFor(a);
            right = valueFor(b);
          }
          if (left === right) return b.updatedAt - a.updatedAt;
          return (left - right) * multiplier;
        });
      }

      function normalizeManualOrder(items) {
        items.forEach((item, index) => { item.order = index; });
      }

      function switchToManualFromCurrentView() {
        if (sortState.key === "manual" && sortState.direction === "asc") return;
        normalizeManualOrder(sortedItems());
        sortState = { key: "manual", direction: "asc" };
      }

      function moveItem(itemId, offset) {
        switchToManualFromCurrentView();
        const items = sortedItems();
        const item = items.find(candidate => candidate.id === itemId);
        if (!item) return;
        const peers = items.filter(candidate => completionRank(candidate) === completionRank(item));
        const index = peers.findIndex(candidate => candidate.id === itemId);
        const targetIndex = index + offset;
        if (index < 0 || targetIndex < 0 || targetIndex >= peers.length) return;
        const target = peers[targetIndex];
        [item.order, target.order] = [target.order, item.order];
        normalizeManualOrder([...state.items].sort((a, b) => a.order - b.order));
        saveState();
        render();
      }

      function dropItem(draggedId, targetId, placeAfter) {
        if (!draggedId || draggedId === targetId) return;
        switchToManualFromCurrentView();
        const items = sortedItems();
        const draggedItem = items.find(item => item.id === draggedId);
        const targetItem = items.find(item => item.id === targetId);
        if (!draggedItem || !targetItem || completionRank(draggedItem) !== completionRank(targetItem)) {
          showNotice("未完成项与已处理项会保持分层显示。", true);
          return;
        }
        const draggedIndex = items.findIndex(item => item.id === draggedId);
        if (draggedIndex < 0) return;
        const [dragged] = items.splice(draggedIndex, 1);
        let targetIndex = items.findIndex(item => item.id === targetId);
        if (targetIndex < 0) return;
        if (placeAfter) targetIndex += 1;
        items.splice(targetIndex, 0, dragged);
        normalizeManualOrder(items);
        saveState();
        render();
      }

      function clearDragStyles() {
        document.querySelectorAll("tbody tr").forEach(row => row.classList.remove("is-dragging", "is-drag-over"));
      }

      function appendGroupHeader(rank, count) {
        const row = document.createElement("tr");
        row.className = `group-header-row${rank === 0 ? " is-priority" : ""}`;
        const cell = document.createElement("td");
        cell.colSpan = 9;
        const heading = document.createElement("div");
        heading.className = "group-heading";
        heading.append(
          textElement("span", "", rank === 0 ? "未完成" : "已处理"),
          textElement("span", "group-heading-detail", rank === 0 ? `${count}项 · 优先显示` : `${count}项 · 已完成或已放弃`)
        );
        cell.appendChild(heading);
        row.appendChild(cell);
        elements.tableBody.appendChild(row);
      }

      function setItemCompleted(item, completed) {
        if (completed) {
          if (isPending(item)) item.previousStatus = item.status;
          item.status = "done";
        } else {
          item.status = item.previousStatus === "ready" ? "ready" : "watch";
        }
        item.updatedAt = Date.now();
      }

      function renderTable() {
        elements.tableBody.replaceChildren();
        const hasItems = state.items.length > 0;
        elements.tableShell.classList.toggle("hidden", !hasItems);
        elements.emptyState.classList.toggle("hidden", hasItems);

        const displayItems = sortedItems();
        const groupCounts = [
          displayItems.filter(item => completionRank(item) === 0).length,
          displayItems.filter(item => completionRank(item) === 1).length
        ];
        let renderedRank = -1;
        displayItems.forEach(item => {
          const rank = completionRank(item);
          if (rank !== renderedRank) {
            appendGroupHeader(rank, groupCounts[rank]);
            renderedRank = rank;
          }
          const row = document.createElement("tr");
          row.dataset.id = item.id;
          row.classList.toggle("is-pending", isPending(item));
          row.classList.toggle("is-inactive", !isPending(item));
          row.classList.toggle("is-completed", item.status === "done");
          row.classList.toggle("is-dropped", item.status === "drop");

          const reorderCell = makeCell("顺序", "reorder");
          const reorderControls = document.createElement("div");
          reorderControls.className = "reorder-controls";
          const dragHandle = textElement("button", "reorder-button drag-handle", "⠿");
          dragHandle.type = "button";
          dragHandle.draggable = true;
          dragHandle.title = "拖动排序";
          dragHandle.setAttribute("aria-label", `拖动${item.name}调整顺序`);
          const moveUp = textElement("button", "reorder-button", "↑");
          moveUp.type = "button";
          moveUp.title = "上移";
          const peerItems = displayItems.filter(candidate => completionRank(candidate) === rank);
          const peerIndex = peerItems.findIndex(candidate => candidate.id === item.id);
          moveUp.disabled = peerIndex === 0;
          moveUp.setAttribute("aria-label", `上移${item.name}`);
          moveUp.addEventListener("click", () => moveItem(item.id, -1));
          const moveDown = textElement("button", "reorder-button", "↓");
          moveDown.type = "button";
          moveDown.title = "下移";
          moveDown.disabled = peerIndex === peerItems.length - 1;
          moveDown.setAttribute("aria-label", `下移${item.name}`);
          moveDown.addEventListener("click", () => moveItem(item.id, 1));
          dragHandle.addEventListener("dragstart", event => {
            draggedItemId = item.id;
            row.classList.add("is-dragging");
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", item.id);
          });
          dragHandle.addEventListener("dragend", () => {
            draggedItemId = null;
            clearDragStyles();
          });
          row.addEventListener("dragover", event => {
            if (!draggedItemId || draggedItemId === item.id) return;
            event.preventDefault();
            document.querySelectorAll("tbody tr.is-drag-over").forEach(candidate => candidate.classList.remove("is-drag-over"));
            row.classList.add("is-drag-over");
          });
          row.addEventListener("drop", event => {
            event.preventDefault();
            const rect = row.getBoundingClientRect();
            dropItem(draggedItemId || event.dataTransfer.getData("text/plain"), item.id, event.clientY > rect.top + rect.height / 2);
            draggedItemId = null;
            clearDragStyles();
          });
          reorderControls.append(dragHandle, moveUp, moveDown);
          reorderCell.appendChild(reorderControls);

          const planCell = makeCell("完成", "plan");
          planCell.className = "center";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "plan-check";
          checkbox.checked = item.status === "done";
          checkbox.disabled = item.status === "drop";
          checkbox.setAttribute("aria-label", checkbox.checked ? `将${item.part} ${item.name}恢复为未完成` : `将${item.part} ${item.name}标记为已完成`);
          checkbox.addEventListener("change", () => {
            setItemCompleted(item, checkbox.checked);
            saveState();
            render();
            showNotice(checkbox.checked ? "已完成，项目已移至下方。" : "已恢复为未完成，项目已移至上方。");
          });
          planCell.appendChild(checkbox);

          const gearCell = makeCell("装备", "gear");
          gearCell.append(
            textElement("div", "gear-part", item.part),
            textElement("div", "gear-name", item.name)
          );
          if (item.note) gearCell.appendChild(textElement("div", "row-note", item.note));

          const affixCell = makeCell("属性变化", "affix");
          affixCell.append(
            textElement("div", "affix-current", item.currentAttribute),
            textElement("div", "affix-arrow", "↓ 提升至"),
            textElement("div", "affix-target", item.targetAttribute)
          );

          const upliftCell = makeCell("提升", "uplift");
          upliftCell.className = "numeric";
          const upliftList = document.createElement("div");
          upliftList.className = "uplift-list";
          item.uplifts.forEach(uplift => {
            const line = document.createElement("div");
            line.className = `uplift-line${uplift.primary ? " is-primary" : ""}`;
            const name = textElement("span", "uplift-name", uplift.label);
            name.prepend(textElement("span", "kind-mark", UPLIFT_KINDS[uplift.kind].shortLabel));
            if (uplift.primary) name.prepend(textElement("span", "primary-mark", "主"));
            const value = textElement("span", "main-number uplift-value", `${formatSignedNumber(uplift.value)}${uplift.unit}`);
            line.append(name, value);
            upliftList.appendChild(line);
          });
          upliftCell.appendChild(upliftList);

          const priceCell = makeCell("价格", "price");
          priceCell.className = "numeric";
          priceCell.append(
            textElement("div", "main-number", formatCny(cnyFor(item))),
            textElement("div", "sub-number", `约${formatGoldWan(goldWanFor(item))}游戏币`)
          );

          const valueCell = makeCell("参考单价", "value");
          valueCell.className = "numeric";
          const primary = primaryUpliftFor(item);
          const efficiencyUnit = primary?.unit || "单位";
          const efficiency = Number.isFinite(valueFor(item)) ? `${formatCny(valueFor(item))}/${efficiencyUnit}` : "—";
          valueCell.append(
            textElement("div", "main-number", efficiency),
            textElement("div", "sub-number", primary ? `${primary.label} · ${UPLIFT_KINDS[primary.kind].label}` : "主指标")
          );

          const statusCell = makeCell("状态", "status");
          const status = STATUS[item.status];
          statusCell.appendChild(textElement("span", `badge ${status.className}`, status.label));

          const actionsCell = makeCell("操作", "actions");
          const actions = document.createElement("div");
          actions.className = "actions-wrap";
          const editButton = textElement("button", "button button-ghost", "编辑");
          editButton.type = "button";
          editButton.addEventListener("click", () => openEditor(item));
          const deleteButton = textElement("button", "button button-ghost button-danger", "删除");
          deleteButton.type = "button";
          deleteButton.addEventListener("click", () => deleteItem(item));
          actions.append(editButton, deleteButton);
          actionsCell.appendChild(actions);

          row.append(reorderCell, planCell, gearCell, affixCell, upliftCell, priceCell, valueCell, statusCell, actionsCell);
          elements.tableBody.appendChild(row);
        });
      }

      function renderStats() {
        const candidates = state.items.filter(item => item.status === "watch" || item.status === "ready");
        const totalCny = candidates.reduce((sum, item) => sum + item.priceCny, 0);
        const upliftCount = candidates.reduce((sum, item) => sum + item.uplifts.length, 0);
        elements.candidateCount.textContent = formatNumber(candidates.length, 0);
        elements.candidateDetail.textContent = `已完成${state.items.filter(item => item.status === "done").length}项 · 已放弃${state.items.filter(item => item.status === "drop").length}项`;
        elements.selectedBudget.textContent = formatCny(totalCny);
        elements.selectedGold.textContent = `约${formatGoldWan(totalCny / state.cnyPerYi * 10000)}游戏币`;
        elements.selectedUplift.textContent = `${formatNumber(upliftCount, 0)}项`;
        elements.selectedCount.textContent = `${candidates.length}个方案等待处理`;
      }

      function renderSortIndicators() {
        document.querySelectorAll(".sort-button").forEach(button => {
          const indicator = button.querySelector(".sort-indicator");
          const active = button.dataset.sort === sortState.key;
          indicator.textContent = active ? (sortState.direction === "asc" ? "↑" : "↓") : "↕";
          button.setAttribute("aria-pressed", active ? "true" : "false");
          button.setAttribute("aria-label", `${button.firstChild.textContent}排序${active ? `，当前${sortState.direction === "asc" ? "升序" : "降序"}` : ""}`);
        });
        elements.mobileSort.value = sortState.key ? `${sortState.key}:${sortState.direction}` : "";
      }

      function render() {
        elements.exchangeRate.value = String(state.cnyPerYi);
        elements.dialogRate.value = String(state.cnyPerYi);
        renderTable();
        renderStats();
        renderSortIndicators();
      }

      function syncUpliftEditor() {
        const rows = [...elements.upliftRows.querySelectorAll(".uplift-row")];
        rows.forEach(row => {
          row.querySelector(".remove-uplift").disabled = rows.length === 1;
        });
        if (!rows.some(row => row.querySelector('[data-uplift-field="primary"]').checked)) {
          rows[0]?.querySelector('[data-uplift-field="primary"]').click();
        }
      }

      function syncUpliftKind(row) {
        const kind = row.querySelector('[data-uplift-field="kind"]').value;
        const unit = row.querySelector('[data-uplift-field="unit"]');
        if (kind === "final") {
          unit.value = "%";
          unit.disabled = true;
          unit.title = "最终加成固定使用百分比";
        } else {
          unit.disabled = false;
          unit.title = "单位可自由填写";
        }
      }

      function addUpliftRow(uplift = { label: "", value: "", unit: "", kind: "stat", primary: false }) {
        const row = document.createElement("div");
        row.className = "uplift-row";

        const primaryLabel = document.createElement("label");
        primaryLabel.className = "primary-choice";
        const primary = document.createElement("input");
        primary.type = "radio";
        primary.name = "primaryUplift";
        primary.dataset.upliftField = "primary";
        primary.checked = Boolean(uplift.primary);
        primary.setAttribute("aria-label", "设为主指标");
        primaryLabel.append(primary, document.createTextNode("主"));

        const kind = document.createElement("select");
        kind.dataset.upliftField = "kind";
        kind.setAttribute("aria-label", "提升数值类型");
        Object.entries(UPLIFT_KINDS).forEach(([value, meta]) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = meta.label;
          kind.appendChild(option);
        });
        kind.value = UPLIFT_KINDS[uplift.kind] ? uplift.kind : "stat";
        kind.addEventListener("change", () => syncUpliftKind(row));

        const label = document.createElement("input");
        label.type = "text";
        label.maxLength = 40;
        label.placeholder = "项目，例如：debuff";
        label.value = uplift.label || "";
        label.dataset.upliftField = "label";
        label.setAttribute("aria-label", "提升项目名称");

        const value = document.createElement("input");
        value.type = "number";
        value.step = "0.01";
        value.inputMode = "decimal";
        value.placeholder = "幅度";
        value.value = uplift.value === "" || uplift.value === undefined ? "" : String(uplift.value);
        value.dataset.upliftField = "value";
        value.setAttribute("aria-label", "提升幅度，可填正数或负数");

        const unit = document.createElement("input");
        unit.type = "text";
        unit.maxLength = 12;
        unit.placeholder = "单位";
        unit.value = uplift.unit ?? "";
        unit.setAttribute("list", "upliftUnits");
        unit.dataset.upliftField = "unit";
        unit.setAttribute("aria-label", "提升单位");

        const remove = textElement("button", "remove-uplift", "×");
        remove.type = "button";
        remove.setAttribute("aria-label", "删除这项提升");
        remove.addEventListener("click", () => {
          row.remove();
          syncUpliftEditor();
        });

        row.append(primaryLabel, kind, label, value, unit, remove);
        elements.upliftRows.appendChild(row);
        syncUpliftKind(row);
        syncUpliftEditor();
      }

      function readUpliftRows() {
        return [...elements.upliftRows.querySelectorAll(".uplift-row")].map(row => ({
          id: newId(),
          label: row.querySelector('[data-uplift-field="label"]').value,
          value: row.querySelector('[data-uplift-field="value"]').value,
          unit: row.querySelector('[data-uplift-field="unit"]').value,
          kind: row.querySelector('[data-uplift-field="kind"]').value,
          primary: row.querySelector('[data-uplift-field="primary"]').checked
        }));
      }

      function openEditor(item = null) {
        elements.form.reset();
        elements.formError.textContent = "";
        elements.itemId.value = item?.id || "";
        elements.dialogTitle.textContent = item ? "编辑升级方案" : "添加升级方案";
        elements.part.value = item?.part || "";
        elements.name.value = item?.name || "";
        elements.currentAttribute.value = item?.currentAttribute || "";
        elements.targetAttribute.value = item?.targetAttribute || "";
        elements.upliftRows.replaceChildren();
        (item?.uplifts || [{ label: "", value: "", unit: "", kind: "stat", primary: true }]).forEach(addUpliftRow);
        elements.price.value = item ? String(item.priceCny) : "";
        elements.dialogRate.value = String(state.cnyPerYi);
        elements.status.value = item?.status || "watch";
        elements.note.value = item?.note || "";
        updatePricePreview();
        elements.dialog.showModal();
        window.setTimeout(() => elements.part.focus(), 0);
      }

      function closeEditor() {
        elements.dialog.close();
      }

      function updatePricePreview() {
        const priceCny = Math.max(0, asFiniteNumber(elements.price.value));
        elements.pricePreview.textContent = `约 ${formatGoldWan(priceCny / state.cnyPerYi * 10000)}游戏币`;
      }

      function updateDialogRate() {
        const cnyPerYi = asFiniteNumber(elements.dialogRate.value, state.cnyPerYi);
        if (cnyPerYi <= 0) {
          elements.dialogRate.value = String(state.cnyPerYi);
          elements.formError.textContent = "1亿游戏币的人民币价格必须大于0。";
          return;
        }
        state.cnyPerYi = cnyPerYi;
        elements.formError.textContent = "";
        saveState();
        render();
        updatePricePreview();
      }

      function saveEditor(event) {
        event.preventDefault();
        elements.formError.textContent = "";
        const rawUplifts = readUpliftRows();
        const hasInvalidUplift = rawUplifts.some(uplift =>
          !String(uplift.label).trim() || !Number.isFinite(Number(uplift.value)) || Number(uplift.value) === 0
        );
        const existing = state.items.find(candidate => candidate.id === elements.itemId.value);
        const item = sanitizeItem({
          id: elements.itemId.value || newId(),
          part: elements.part.value,
          name: elements.name.value,
          currentAttribute: elements.currentAttribute.value,
          targetAttribute: elements.targetAttribute.value,
          uplifts: rawUplifts,
          priceCny: elements.price.value,
          order: existing?.order ?? state.items.length,
          status: elements.status.value,
          previousStatus: elements.status.value === "watch" || elements.status.value === "ready"
            ? elements.status.value
            : (existing && isPending(existing) ? existing.status : existing?.previousStatus),
          note: elements.note.value,
          createdAt: existing?.createdAt || Date.now(),
          updatedAt: Date.now()
        }, state.cnyPerYi);

        if (!item || hasInvalidUplift || elements.price.value === "") {
          elements.formError.textContent = "请完整填写装备、属性、每项提升的名称与非零幅度，以及人民币价格。";
          return;
        }

        const index = state.items.findIndex(candidate => candidate.id === item.id);
        if (index >= 0) state.items[index] = item;
        else state.items.push(item);
        saveState();
        closeEditor();
        render();
        showNotice(index >= 0 ? "方案已更新。" : "方案已添加。" );
      }

      function deleteItem(item) {
        if (!window.confirm(`删除“${item.part} · ${item.name}”的升级方案？`)) return;
        state.items = state.items.filter(existing => existing.id !== item.id);
        normalizeManualOrder([...state.items].sort((a, b) => a.order - b.order));
        saveState();
        render();
        showNotice("方案已删除。" );
      }

      function setSort(key) {
        if (sortState.key === key) {
          sortState.direction = sortState.direction === "asc" ? "desc" : "asc";
        } else {
          sortState.key = key;
          sortState.direction = key === "uplift" ? "desc" : "asc";
        }
        render();
      }

      function setMobileSort(value) {
        if (!value) {
          sortState = { key: null, direction: "asc" };
        } else {
          const [key, direction] = value.split(":");
          sortState = { key, direction };
        }
        render();
      }

      function updateRate() {
        const cnyPerYi = asFiniteNumber(elements.exchangeRate.value, state.cnyPerYi);
        if (cnyPerYi <= 0) {
          elements.exchangeRate.value = String(state.cnyPerYi);
          showNotice("1亿游戏币的人民币价格必须大于0。", true);
          return;
        }
        state.cnyPerYi = cnyPerYi;
        saveState();
        render();
      }

      function exportData() {
        const payload = JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
        const blob = new Blob([payload], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `mabinogi-equipment-upgrades-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showNotice("备份已导出。" );
      }

      async function importData(file) {
        try {
          const parsed = JSON.parse(await file.text());
          const cnyPerYi = readCnyPerYi(parsed, state.cnyPerYi);
          const items = Array.isArray(parsed.items) ? parsed.items.map((item, index) => sanitizeItem(item, cnyPerYi, index)).filter(Boolean) : null;
          if (!items) throw new Error("invalid");
          if (!window.confirm(`导入${items.length}项方案并替换当前清单？`)) return;
          state = {
            version: 5,
            cnyPerYi,
            items
          };
          sortState = { key: "manual", direction: "asc" };
          saveState();
          render();
          showNotice(`已导入${items.length}项方案。` );
        } catch (error) {
          showNotice("无法导入：文件格式不正确。", true);
        } finally {
          elements.importFile.value = "";
        }
      }

      function clearAll() {
        if (state.items.length === 0) return;
        if (!window.confirm("清空全部升级方案？此操作无法撤销。")) return;
        state.items = [];
        sortState = { key: "manual", direction: "asc" };
        saveState();
        render();
        showNotice("清单已清空。" );
      }

      elements.themeToggle.addEventListener("click", toggleTheme);
      elements.addButton.addEventListener("click", () => openEditor());
      elements.emptyAddButton.addEventListener("click", () => openEditor());
      elements.dialogClose.addEventListener("click", closeEditor);
      elements.cancelButton.addEventListener("click", closeEditor);
      elements.form.addEventListener("submit", saveEditor);
      elements.addUpliftButton.addEventListener("click", () => addUpliftRow());
      elements.price.addEventListener("input", updatePricePreview);
      elements.dialogRate.addEventListener("change", updateDialogRate);
      elements.exchangeRate.addEventListener("change", updateRate);
      elements.exportButton.addEventListener("click", exportData);
      elements.importButton.addEventListener("click", () => elements.importFile.click());
      elements.importFile.addEventListener("change", () => {
        const file = elements.importFile.files?.[0];
        if (file) void importData(file);
      });
      elements.clearButton.addEventListener("click", clearAll);
      elements.mobileSort.addEventListener("change", () => setMobileSort(elements.mobileSort.value));
      document.querySelectorAll(".sort-button").forEach(button => button.addEventListener("click", () => setSort(button.dataset.sort)));
      elements.dialog.addEventListener("click", event => {
        if (event.target === elements.dialog) closeEditor();
      });

      applyTheme(document.documentElement.dataset.theme, false);
      render();
    })();
  </script>
</body>
</html>
