<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>洛奇个人工具集</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030405;
      --panel: rgba(12, 17, 22, .88);
      --panel-hover: rgba(18, 27, 35, .96);
      --ink: #eef7fb;
      --muted: #8ca0aa;
      --line: rgba(188, 224, 241, .14);
      --line-hover: rgba(139, 217, 255, .46);
      --blue: #8bd9ff;
      --spectrum: linear-gradient(90deg, #ff4d4d, #ffb84d 18%, #f5ef58 35%, #64db74 53%, #51d9ed 70%, #7896ff 84%, #c27bea);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 73% 13%, rgba(87, 170, 224, .10), transparent 26rem),
        radial-gradient(circle at 28% 72%, rgba(161, 90, 215, .07), transparent 30rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 82%);
    }

    .shell {
      width: min(1060px, calc(100% - 40px));
      margin: 0 auto;
      padding: 82px 0 64px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--spectrum);
      box-shadow: 0 0 12px rgba(120, 200, 255, .55);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(34px, 7vw, 68px);
      line-height: 1.04;
      letter-spacing: -.045em;
    }

    .intro {
      max-width: 650px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .prism-line {
      width: 100%;
      height: 2px;
      margin: 40px 0 28px;
      background: var(--spectrum);
      box-shadow: 0 0 18px rgba(112, 196, 255, .38);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      min-height: 244px;
      display: flex;
      flex-direction: column;
      padding: 26px;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      text-decoration: none;
      backdrop-filter: blur(16px);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--line-hover);
      background: var(--panel-hover);
    }

    .badge {
      align-self: flex-start;
      padding: 5px 9px;
      color: #bfeaff;
      background: rgba(102, 191, 235, .08);
      border: 1px solid rgba(139, 217, 255, .18);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    h2 {
      margin: 30px 0 10px;
      font-size: 23px;
      letter-spacing: -.025em;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .open {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 25px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
    }

    .open::after { content: "→"; font-size: 18px; }

    .local-note {
      margin: 24px 0 0;
      color: #647680;
      font-size: 11px;
      line-height: 1.65;
    }

    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1060px); padding-top: 54px; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 220px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Mabinogi Toolkit</div>
    <h1>洛奇个人工具集</h1>
    <p class="intro">集中存放制作、装备与资源规划工具。选一个工具即可开始，使用进度会保存在当前设备的浏览器中。</p>
    <div class="prism-line" aria-hidden="true"></div>

    <section class="grid" aria-label="工具列表">
      <a class="card" href="../">
        <span class="badge">制作规划</span>
        <h2>释魂者武器制作追踪器</h2>
        <p>按武器查看材料需求、宝珠缺口与制作进度，并提供成本估算和价格快照。</p>
        <span class="open">打开追踪器</span>
      </a>

      <a class="card" href="../equipment-upgrade-planner/">
        <span class="badge">装备规划</span>
        <h2>装备提升清单</h2>
        <p>管理装备升级路线、预算和提升幅度。完成项自动下沉，未完成项目始终优先。</p>
        <span class="open">打开清单</span>
      </a>
    </section>

    <p class="local-note">提示：目前未接入云端数据库，进度只保存在本机浏览器；换设备后会从空白状态开始。</p>
  </main>
</body>
</html>
